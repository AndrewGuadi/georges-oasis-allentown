<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} | George's Oasis</title>
  <meta name="description" content="{{ description }}">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-[#f7f3e8] text-[#233c31] antialiased">
  <header class="border-b border-[#dcded2] bg-[#f7f3e8]">
    <nav class="mx-auto flex min-h-20 w-[min(1240px,calc(100%-2rem))] items-center justify-between gap-6" aria-label="Main navigation">
      <a href="/" class="font-serif text-3xl font-bold tracking-tight text-[#183d30]">George's Oasis<span class="text-[#e3bd74]">.</span></a>
      <div class="hidden items-center gap-6 text-sm font-semibold md:flex">
        <a href="/menu" class="hover:text-[#71815e]">Menu</a>
        <a href="/mini-golf" class="hover:text-[#71815e]">Mini Golf</a>
        <a href="/parties" class="hover:text-[#71815e]">Parties</a>
        <a href="/visit" class="hover:text-[#71815e]">Visit</a>
      </div>
      <a href="/order" class="rounded bg-[#183d30] px-4 py-3 text-sm font-bold text-[#fffdf7] hover:bg-[#28513e]">Order online</a>
    </nav>
  </header>
  <main class="mx-auto flex min-h-[calc(100vh-81px)] w-[min(900px,calc(100%-2rem))] items-center py-20">
    <section class="max-w-2xl">
      <p class="mb-4 text-xs font-bold uppercase tracking-[0.18em] text-[#71815e]">George's Oasis</p>
      <h1 class="font-serif text-5xl leading-none tracking-tight text-[#183d30] sm:text-7xl">{{ title }}</h1>
      <p class="mt-7 max-w-xl text-lg leading-8 text-[#626b61]">{{ description }}</p>
      <div class="mt-10 border-t border-[#dcded2] pt-6">
        <p class="text-sm text-[#626b61]">This page is being prepared. Check back soon, or return to the homepage for current information.</p>
        <a href="/" class="mt-6 inline-flex rounded border border-[#bfc6b7] px-5 py-3 text-sm font-bold hover:border-[#71815e] hover:text-[#71815e]">Back to home</a>
      </div>
    </section>
  </main>
</body>
</html>
