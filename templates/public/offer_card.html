<article style="background:#fffdf7;border:1px solid #dcded2;border-radius:8px;overflow:hidden;margin-bottom:20px">{% if offer.image %}<img src="{{ url_for('admin.uploaded_image', filename=offer.image) }}" alt="{{ offer.title }}" loading="lazy" style="height:220px;object-fit:cover">{% endif %}<div style="padding:24px"><h3 style="font:28px Georgia,serif">{{ offer.title }}</h3><p style="white-space:pre-line;margin-top:12px">{{ offer.description }}</p>{% if offer.code %}<p style="margin-top:16px">Use code: <strong>{{ offer.code }}</strong></p>{% endif %}{% if offer.ends_at %}<p style="margin-top:12px;font-size:13px">Ends {{ offer.ends_at|local_input|replace('T', ' at ') }} Eastern</p>{% endif %}</div></article>
