<div class="site-navigation">
  <a class="nav-link" href="{{ url_for('public.home') }}"{% if request.endpoint == 'public.home' %} aria-current="page"{% endif %}>Home</a>
  {% for item in site_pages %}
  <a class="nav-link" href="{{ url_for('public.' ~ item.key) }}"{% if request.endpoint == 'public.' ~ item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>
  {% endfor %}
</div>
