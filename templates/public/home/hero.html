{% from 'public/includes/icons.html' import icon %}
<section class="hero" style="--hero-photo: url('{{ url_for('static', filename='images/optimized/main_exterior_oasis.webp') }}')" aria-labelledby="hero-title">
  <div class="hero-content">
    <p class="hero-eyebrow">A family tradition in Allentown</p>
    <h1 id="hero-title">More Than a Meal</h1>
    <p class="hero-subtitle">Family recipes, passed down and made with care.</p>
    <p class="hero-description">A little time to slow down, together.</p>
    <div class="hero-actions">
      <a class="btn btn-gold" href="{{ url_for('public.food') }}">View Menu {{ icon('arrow') }}</a>
      <a class="btn btn-glass" href="{{ url_for('public.visit') }}">Plan Your Visit {{ icon('pin') }}</a>
    </div>
  </div>
  <a class="hero-location" href="{{ external_links.directions }}" target="_blank" rel="noopener noreferrer">{{ icon('pin') }} {{ business.address }} <span aria-hidden="true">↗</span></a>
</section>
