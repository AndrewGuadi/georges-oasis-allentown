{% extends 'admin/base.html' %}
{% block content %}<section class="panel login"><h1>Welcome back</h1><p>Manage offers, event inquiries and website content.</p>{% if throttled %}<p role="alert" class="notice error">Too many sign-in attempts. Please wait 15 minutes before trying again.</p>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Sign in</button></form></section>{% endblock %}
