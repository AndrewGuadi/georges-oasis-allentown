<nav class="pagination" aria-label="Pagination">{% if page.has_prev %}<a href="{{ url_for(request.endpoint, **dict(request.args, page=page.prev_num)) }}">← Previous</a>{% endif %}<span>Page {{ page.page }} of {{ page.pages or 1 }}</span>{% if page.has_next %}<a href="{{ url_for(request.endpoint, **dict(request.args, page=page.next_num)) }}">Next →</a>{% endif %}</nav>
