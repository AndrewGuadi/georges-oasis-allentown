{% extends 'admin/base.html' %}{% block content %}<h1>Change password</h1>{% if error %}<p role="alert" class="notice error">{{ error }}</p>{% endif %}<form method="post" class="panel"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New passphrase<input type="password" name="password" autocomplete="new-password" minlength="15" maxlength="256" required></label><label>Repeat new passphrase<input type="password" name="confirm_password" autocomplete="new-password" required></label><button class="primary">Change password and sign out</button></form>{% endblock %}
