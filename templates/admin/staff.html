{% extends 'admin/base.html' %}{% block content %}<h1>Staff access</h1><p>Create accounts or reset passwords using the secure staff-user command on the host. Disabling access revokes existing sessions.</p>{% for user in users %}<form method="post" class="panel" action="{{ url_for('backend.staff_access',user_id=user.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><h2>{{ user.display_name }} · {{ user.username }}</h2><label>Role<select name="role">{% for role in ['owner','editor','inquiry'] %}<option {% if role==user.role %}selected{% endif %}>{{ role }}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="active" {% if user.active %}checked{% endif %}>Active</label><label>Confirm your password<input type="password" name="current_password" autocomplete="current-password" required></label><button>Update access</button></form>{% endfor %}{% endblock %}
