<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Owner dashboard | George’s Oasis</title><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script><link rel="stylesheet" href="{{ url_for('static', filename='css/owner.css') }}"></head>
<body><header><a href="{{ url_for('admin.dashboard') }}">George’s Oasis · Owner dashboard</a><nav><a href="{{ url_for('public.home') }}">View website</a>{% if session.get('owner') %}<form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button>Log out</button></form>{% endif %}</nav></header><main>
{% for category, message in get_flashed_messages(with_categories=true) %}<p role="alert" class="notice {{ category }}">{{ message }}</p>{% endfor %}
{% block content %}{% endblock %}</main></body></html>
